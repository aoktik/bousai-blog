name: 毎日の記事生成（下書き）

on:
  # 日次実行は SiteGuard WAF が GitHub Actions IP をブロックするため無効化
  # 自動実行は scripts/install_launchd.sh で macOS launchd を使用
  # schedule:
  #   - cron: '0 22 * * *'   # JST 7:00
  workflow_dispatch:   # 手動実行のみ可能

concurrency:
  group: daily-article
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-article:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係をインストール
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pillow
          fi

      - name: 下書き記事を生成して投稿
        env:
          WP_URL:               ${{ secrets.WP_URL }}
          WP_USER:              ${{ secrets.WP_USER }}
          WP_PASSWORD:          ${{ secrets.WP_PASSWORD }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          A8_PRIME_VIDEO_LINK:  ${{ secrets.A8_PRIME_VIDEO_LINK }}
          A8_PRIME_VIDEO_IMG:   ${{ secrets.A8_PRIME_VIDEO_IMG }}
        run: python daily_enhanced.py --no-research

      - name: 状態ファイルをコミット
        run: |
          git config user.name  "Bousai Bot"
          git config user.email "bot@aoktik.online"
          git add data/state.json data/state_enhanced.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update state [skip ci]"
          git push || true

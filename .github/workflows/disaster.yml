name: 災害監視・緊急記事生成

on:
  schedule:
    - cron: '*/10 * * * *'  # 10分ごとに実行
  workflow_dispatch:          # 手動実行も可能

concurrency:
  group: disaster-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリをインストール
        run: pip install -r requirements.txt

      - name: 災害を監視・記事を生成して投稿
        env:
          RAKUTEN_APP_ID:       ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          WP_URL:               ${{ secrets.WP_URL }}
          WP_USER:              ${{ secrets.WP_USER }}
          WP_PASSWORD:          ${{ secrets.WP_PASSWORD }}
        run: python disaster.py

      - name: 状態ファイルをリポジトリに保存
        run: |
          git config user.name  "Bousai Bot"
          git config user.email "bot@aoktik.online"
          git add data/state.json
          git diff --staged --quiet || git commit -m "chore: update disaster state [skip ci]"
          git push
